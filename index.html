<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>I Nyoman Wahyu — Portfolio & Landing Page</title>
    <meta name="description" content="Full Stack Developer berbasis di Makassar, Indonesia. Portofolio resmi I Nyoman Wahyu." />
    <meta name="theme-color" content="#fbf6ea" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="I Nyoman Wahyu — Portfolio & Landing Page" />
    <meta property="og:description" content="Full Stack Developer berbasis di Makassar, Indonesia." />
    <meta property="og:image" content="/assets/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Fonts: Anton & Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Theme flash prevention script -->
    <script>
      (function() {
        const theme = localStorage.getItem('theme') || 'system';
        const isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-[var(--bg)] text-[var(--fg)] font-sans antialiased selection:bg-[var(--accent)] selection:text-[var(--fg)]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
